version: '3.8'

services:
  # ============================================
  # NGINX - Frontend con OCSP Stapling
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nginx-ocsp
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    networks:
      - web-public
    depends_on:
      - traefik

  # ============================================
  # TRAEFIK - Reverse Proxy (solo interno)
  # ============================================
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      # API y Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web-public"

      # Entrypoints (solo HTTP interno, HTTPS lo maneja nginx)
      - "--entrypoints.web.address=:80"

      # Logs
      - "--log.level=INFO"
      - "--accesslog=true"

    # Ya no exponemos puertos externos, nginx es el frontend
    expose:
      - "80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - web-public

  # ============================================
  # GIPIS WEB - Aplicación Flask
  # ============================================
  web:
    build: .
    container_name: gipis-web
    restart: unless-stopped
    volumes:
      - ./instance:/app/instance
      - ./app/static/img:/app/app/static/img
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-cambia-esta-clave-en-produccion}
      - MAIL_USERNAME=${MAIL_USERNAME:-gipis.unp@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-/umami/script.js}
    expose:
      - "5000"
    networks:
      - web-public
    labels:
      - "traefik.enable=true"
      # HTTP router (nginx maneja HTTPS y redirección)
      - "traefik.http.routers.gipis.rule=Host(`${DOMAIN:-gipis.unp.edu.ar}`)"
      - "traefik.http.routers.gipis.entrypoints=web"
      # Service
      - "traefik.http.services.gipis.loadbalancer.server.port=5000"

  # ============================================
  # UMAMI - Analytics (privacy-friendly)
  # ============================================
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: gipis-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami_secret}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-umami-secret-change-in-production}
      TRACKER_SCRIPT_NAME: script.js
    depends_on:
      umami-db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - web-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami.rule=Host(`${DOMAIN:-gipis.unp.edu.ar}`) && PathPrefix(`/umami`)"
      - "traefik.http.routers.umami.entrypoints=web"
      - "traefik.http.middlewares.umami-strip.stripprefix.prefixes=/umami"
      - "traefik.http.routers.umami.middlewares=umami-strip"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"

  umami-db:
    image: postgres:15-alpine
    container_name: gipis-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami_secret}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - web-public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  web-public:
    name: web-public
    driver: bridge

volumes:
  umami-db-data:
